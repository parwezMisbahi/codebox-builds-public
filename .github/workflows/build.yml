name: CodeBox Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Unzip project
        run: |
          mkdir -p _src
          unzip -q project.zip -d _src
          DIR=_src
          if [ ! -f "$DIR/settings.gradle.kts" ] && [ ! -f "$DIR/settings.gradle" ]; then
            DIR=$(find _src -maxdepth 3 -name 'settings.gradle*' -printf '%h\n' | head -n1)
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Use fixed debug key (so updates install over old build)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Apply build settings (codebox-build.yml - name, package, icon, version)
        run: |
          python3 - <<'PYEOF'
          import os, re, sys, glob, shutil, subprocess

          root = os.environ["PROJECT_DIR"]
          cfg_path = os.path.join(root, "codebox-build.yml")
          env_out = os.environ.get("GITHUB_ENV")

          def log(m): print("[codebox-config] " + m, flush=True)
          def die(m):
              print("::error::codebox-build.yml: " + m, flush=True)
              sys.exit(1)

          # ---- tiny "key: value" reader (no PyYAML needed) ----
          cfg = {}
          if os.path.isfile(cfg_path):
              for raw in open(cfg_path, encoding="utf-8-sig").read().splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or ":" not in line:
                      continue
                  k, v = line.split(":", 1)
                  k, v = k.strip().lower(), v.strip()
                  if v[:1] in "\"'" and v.count(v[0]) >= 2:
                      v = v[1:v.index(v[0], 1)]
                  else:
                      v = re.split(r"\s+#", v)[0].strip()
                  if v:
                      cfg[k] = v
              log("config: " + ", ".join(k for k in cfg if "pass" not in k) or "(empty)")
          else:
              log("codebox-build.yml nahi mili - project jaisa hai waisa build hoga")

          def find_app_modules():
              mods = []
              for f in glob.glob(os.path.join(root, "**", "build.gradle*"), recursive=True):
                  if "/build/" in f.replace("\\", "/") or "/node_modules/" in f:
                      continue
                  t = open(f, encoding="utf-8", errors="ignore").read()
                  if re.search(r"com\.android\.application", t):
                      mods.append(os.path.dirname(f))
              return mods or [os.path.join(root, "app")]

          def gradle_file(mod):
              for n in ("build.gradle.kts", "build.gradle"):
                  p = os.path.join(mod, n)
                  if os.path.isfile(p):
                      return p
              return None

          modules = find_app_modules()
          log("app module: " + ", ".join(os.path.relpath(m, root) for m in modules))

          # ---- package name / version ----
          pkg = cfg.get("package_name") or cfg.get("package")
          if pkg and not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", pkg):
              die("package_name galat hai: %r (example: com.mycompany.myapp)" % pkg)

          def set_gradle(mod, key, value, quote):
              gf = gradle_file(mod)
              if not gf:
                  return
              t = open(gf, encoding="utf-8").read()
              val = '"%s"' % value if quote else value
              pat = re.compile(r"(\b%s\s*=?\s*)(\"[^\"]*\"|'[^']*'|\d+)" % key)
              if pat.search(t):
                  t = pat.sub(lambda m: m.group(1) + val, t, count=1)
              else:
                  m = re.search(r"defaultConfig\s*\{", t)
                  if not m:
                      die("%s me defaultConfig nahi mila, %s set nahi ho saka" % (gf, key))
                  eq = "" if gf.endswith(".gradle") else "= "
                  t = t[:m.end()] + "\n        %s %s%s" % (key, eq, val) + t[m.end():]
              open(gf, "w", encoding="utf-8").write(t)

          for mod in modules:
              if pkg:
                  set_gradle(mod, "applicationId", pkg, True)
                  log("package name -> " + pkg)
              if cfg.get("version_name"):
                  set_gradle(mod, "versionName", cfg["version_name"], True)
                  log("versionName -> " + cfg["version_name"])
              if cfg.get("version_code"):
                  if not cfg["version_code"].isdigit():
                      die("version_code number hona chahiye")
                  set_gradle(mod, "versionCode", cfg["version_code"], False)
                  log("versionCode -> " + cfg["version_code"])

          # ---- app name ----
          name = cfg.get("app_name") or cfg.get("name")
          def esc_xml(s):
              s = s.replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")
              return s.replace("\\", "\\\\").replace("'", "\\'").replace('"', '\\"')

          def manifest_of(mod):
              p = os.path.join(mod, "src", "main", "AndroidManifest.xml")
              return p if os.path.isfile(p) else None

          if name:
              for mod in modules:
                  mf = manifest_of(mod)
                  if not mf:
                      continue
                  t = open(mf, encoding="utf-8").read()
                  m = re.search(r'android:label\s*=\s*"([^"]*)"', t)
                  done = False
                  if m and m.group(1).startswith("@string/"):
                      key = m.group(1)[len("@string/"):]
                      for sf in glob.glob(os.path.join(mod, "src", "*", "res", "values*", "strings.xml")):
                          s = open(sf, encoding="utf-8").read()
                          p = re.compile(r'(<string\s+name="%s"[^>]*>)(.*?)(</string>)' % re.escape(key), re.S)
                          if p.search(s):
                              s = p.sub(lambda mm: mm.group(1) + esc_xml(name) + mm.group(3), s)
                              open(sf, "w", encoding="utf-8").write(s)
                              done = True
                  if not done:
                      if m:
                          t = t[:m.start()] + 'android:label="%s"' % name.replace("&", "&amp;").replace('"', "&quot;").replace("<", "&lt;") + t[m.end():]
                      else:
                          t = re.sub(r"<application", '<application android:label="%s"' % name.replace("&", "&amp;").replace('"', "&quot;").replace("<", "&lt;"), t, count=1)
                      open(mf, "w", encoding="utf-8").write(t)
                  # activity-level labels would override the app name on the launcher
                  t = open(mf, encoding="utf-8").read()
                  t2 = re.sub(r'(<activity\b[^>]*?)\s+android:label\s*=\s*"[^"]*"', r"\1", t)
                  if t2 != t:
                      open(mf, "w", encoding="utf-8").write(t2)
                  log("app name -> " + name)

          # ---- icon ----
          icon = cfg.get("icon")
          if icon:
              src = os.path.normpath(os.path.join(root, icon))
              if not os.path.isfile(src):
                  die("icon file nahi mili: %s (project me daalo, jaise icon.png)" % icon)
              conv = shutil.which("magick") or shutil.which("convert")
              if not conv:
                  die("ImageMagick runner par nahi hai")
              sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
              for mod in modules:
                  mf = manifest_of(mod)
                  if not mf:
                      continue
                  res = os.path.join(mod, "src", "main", "res")
                  for d, px in sizes.items():
                      od = os.path.join(res, "mipmap-" + d)
                      os.makedirs(od, exist_ok=True)
                      cmd = ([conv] if os.path.basename(conv) == "magick" else [conv]) + [
                          src + "[0]", "-background", "none", "-resize", "%dx%d^" % (px, px),
                          "-gravity", "center", "-extent", "%dx%d" % (px, px),
                          os.path.join(od, "codebox_icon.png")]
                      subprocess.run(cmd, check=True)
                  t = open(mf, encoding="utf-8").read()
                  for attr in ("icon", "roundIcon"):
                      val = "@mipmap/codebox_icon"
                      if re.search(r'android:%s\s*=\s*"[^"]*"' % attr, t):
                          t = re.sub(r'android:%s\s*=\s*"[^"]*"' % attr, 'android:%s="%s"' % (attr, val), t, count=1)
                      else:
                          t = t.replace("<application", '<application android:%s="%s"' % (attr, val), 1)
                  open(mf, "w", encoding="utf-8").write(t)
              log("icon -> " + icon)

          # ---- signing key (applied after the build, see "Sign APK" step) ----
          ks = cfg.get("keystore")
          env = {}
          if ks:
              kp = os.path.normpath(os.path.join(root, ks))
              if not os.path.isfile(kp):
                  die("keystore file nahi mili: %s" % ks)
              sp = cfg.get("keystore_password") or os.environ.get("CODEBOX_KEYSTORE_PASSWORD", "")
              alias = cfg.get("key_alias") or ""
              if not sp or not alias:
                  die("keystore ke saath keystore_password aur key_alias bhi chahiye")
              kpass = cfg.get("key_password") or sp
              for secret in (sp, kpass):
                  print("::add-mask::" + secret)
              env.update(CB_KS=kp, CB_KS_PASS=sp, CB_KEY_ALIAS=alias, CB_KEY_PASS=kpass)
              log("signing: custom keystore (%s, alias %s)" % (ks, alias))
          else:
              log("signing: fixed CodeBox debug key")

          if env_out:
              with open(env_out, "a") as f:
                  for k, v in env.items():
                      f.write("%s=%s\n" % (k, v))
          PYEOF

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Sign APK with custom keystore (only if keystore is set in codebox-build.yml)
        if: ${{ env.CB_KS != '' }}
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner | sort -V | tail -n1)
          echo "apksigner: $APKSIGNER"
          for f in $(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk'); do
            "$APKSIGNER" sign --ks "$CB_KS" --ks-key-alias "$CB_KEY_ALIAS" \
              --ks-pass env:CB_KS_PASS --key-pass env:CB_KEY_PASS \
              --v4-signing-enabled false --out "$f.signed" "$f"
            mv "$f.signed" "$f"
            "$APKSIGNER" verify --print-certs "$f" | head -n 3
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
